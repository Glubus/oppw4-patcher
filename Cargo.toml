[workspace]
members = [
    "apps/dinput8-proxy",
    "apps/moveset-tool",
    "apps/rdb-tool",
    "crates/struct-api",
    "crates/asm",
    "crates/hooks",
    "crates/lua-api",
    "crates/plugins/abi",
    "crates/plugins/host",
    "crates/plugins/sdk",
    "crates/rdb",
    "plugins/skin_patcher",
    "plugins/fx_director",
    "plugins/moveset_patcher",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rdb = { path = "crates/rdb" }
struct-api = { path = "crates/struct-api" }
asm = { path = "crates/asm" }
plugin-sdk = { path = "crates/plugins/sdk" }
plugin-abi = { path = "crates/plugins/abi" }
plugin-host = { path = "crates/plugins/host" }
hooks = { path = "crates/hooks" }
lua-api = { path = "crates/lua-api" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
